function interactionResponse(x,type="LIFE"){

 function decay(x){let now=Date.now(),mins=Math.min(180,(now-(x.lastTick||now))/60000);if(mins>=1){x.hunger=clamp(x.hunger-mins*.18);x.energy=clamp(x.energy-mins*.12);x.hygiene=clamp(x.hygiene-mins*.08);x.stress=clamp(x.stress+mins*.05);x.mood=clamp(x.mood-(x.hunger<25||x.energy<20?mins*.08:0));x.lastTick=now;save(x)}}
 window.sdV160=function(a){let x=load();decay(x);let c=cash();if(a==='eat'){if(c<12)return alert('You need $12 for a meal.');setCash(c-12);x.hunger=clamp(x.hunger+30);x.mood=clamp(x.mood+3);note(x,'You ate a meal. Hunger improved.')}if(a==='sleep'){x.energy=100;x.sleep=100;x.stress=clamp(x.stress-18);x.hunger=clamp(x.hunger-8);note(x,'You slept and recovered energy.')}if(a==='shower'){x.hygiene=100;x.mood=clamp(x.mood+4);note(x,'You cleaned up and feel better.')}if(a==='relax'){x.stress=clamp(x.stress-20);x.mood=clamp(x.mood+10);note(x,'You took time to decompress.')}if(a==='work'){if(x.energy<15||x.hunger<15){x.workPerf=clamp(x.workPerf-8);x.bossRep-=2;note(x,'You struggled through work because your needs were low.')}else{x.energy=clamp(x.energy-18);x.hunger=clamp(x.hunger-12);x.stress=clamp(x.stress+9);x.workPerf=clamp(x.workPerf+5);x.bossRep+=2;setCash(c+90);note(x,'You completed a work block. +$90 and job performance improved.')}}if(a==='social'){x.stress=clamp(x.stress-8);x.mood=clamp(x.mood+8);x.coworkerRep+=2;x.familyRep+=1;note(x,'You spent time with people in your life.')}if(a==='drive'){if(x.carFuel<10)return alert('You need fuel.');x.carFuel=clamp(x.carFuel-8);x.carCondition=clamp(x.carCondition-1);note(x,'You drove across the city. Fuel and vehicle condition changed.')}if(a==='fuel'){if(c<35)return alert('You need $35 for fuel.');setCash(c-35);x.carFuel=100;note(x,'You filled the tank.')}if(a==='repair'){if(c<120)return alert('You need $120 for repairs.');setCash(c-120);x.carCondition=100;note(x,'Your vehicle was repaired.')}if(a==='bills'){let total=x.rentDue+x.utilities+x.phoneBill+x.insurance;if(c<total)return alert('You need $'+total+' to cover current bills.');setCash(c-total);x.rentDue=650;x.utilities=110;x.phoneBill=65;x.insurance=85;x.stress=clamp(x.stress-12);note(x,'You covered rent, utilities, phone and insurance.')}save(x);render()};
 function meter(n,v){return `<b>${n} ${v}/100</b><div class="v160bar"><i style="width:${v}%"></i></div>`}
 function render(){let h=document.getElementById('v160Life');if(!h)return;let x=load();decay(x);let bills=x.rentDue+x.utilities+x.phoneBill+x.insurance;h.innerHTML=`<h2>🏙️ v16.0 — Life Simulation Overhaul</h2><p class="muted">Your character now has a continuous daily life. Needs, work, money, relationships, transportation and the city affect each other.</p><div class="v160grid"><div class="v160box"><h3>🧍 Needs</h3>${meter('Hunger',x.hunger)}${meter('Energy',x.energy)}${meter('Hygiene',x.hygiene)}${meter('Mood',x.mood)}${meter('Stress',100-x.stress)}<div class="v160actions"><button onclick="sdV160('eat')">Eat $12</button><button onclick="sdV160('sleep')">Sleep</button><button onclick="sdV160('shower')">Shower</button><button onclick="sdV160('relax')">Relax</button></div></div><div class="v160box"><h3>💼 Daily Routine & Career</h3><p>Work performance <b>${x.workPerf}/100</b><br>Boss relationship ${x.bossRep} • Coworkers ${x.coworkerRep}</p><div class="v160actions"><button onclick="sdV160('work')">Work Active Block</button><button onclick="sdV160('social')">Socialize</button></div><p class="muted">Low hunger/energy now hurts job performance; healthy routines improve your path.</p></div><div class="v160box"><h3>💵 Cost of Living</h3><p>Cash <b>$${cash().toLocaleString()}</b><br>Rent $${x.rentDue} • Utilities $${x.utilities} • Phone $${x.phoneBill} • Insurance $${x.insurance}</p><p>Total current bills <b>$${bills}</b></p><button onclick="sdV160('bills')">Pay Current Bills</button></div><div class="v160box"><h3>🚗 Vehicle Life</h3>${meter('Condition',x.carCondition)}${meter('Fuel',x.carFuel)}<div class="v160actions"><button onclick="sdV160('drive')">Drive</button><button onclick="sdV160('fuel')">Fuel $35</button><button onclick="sdV160('repair')">Repair $120</button></div></div><div class="v160box"><h3>❤️ Relationships</h3><p>Family ${x.familyRep} • Partner ${x.partnerRep} • Coworkers ${x.coworkerRep}</p><span class="v160tag">NPC Memory</span><span class="v160tag">Friends & Enemies</span><span class="v160tag">Dating / Family</span><p class="muted">Existing v15 NPC memory and story choices remain active and now sit beside your daily-life system.</p></div><div class="v160box"><h3>🌐 One Continuous World</h3><span class="v160tag">Jobs</span><span class="v160tag">Crime & Court</span><span class="v160tag">Businesses</span><span class="v160tag">Homes</span><span class="v160tag">Cars</span><span class="v160tag">Multiplayer</span><span class="v160tag">Crews</span><p class="muted">v16 preserves the v15 world and connects everyday pressure to progression instead of replacing existing systems.</p></div></div><h3>📱 Life Feed</h3>${x.notices.map(n=>`<div class="v150notice">${n}</div>`).join('')}`}
 function mount(){if(document.getElementById('v160Life'))return;let p=[...document.querySelectorAll('main,.content,#content,#app')].find(e=>e.offsetParent!==null)||document.body,d=document.createElement('section');d.id='v160Life';d.className='card';p.appendChild(d);render()}
 let old=window.render;if(typeof old==='function')window.render=function(){let r=old.apply(this,arguments);setTimeout(mount,0);return r};window.addEventListener('load',()=>setTimeout(mount,950));setInterval(()=>{let x=load();decay(x);if(document.getElementById('v160Life'))render()},60000);
})();
</script>


<style>
#v170Legacy{margin:12px}.v170grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.v170box{background:#0b1220;border:1px solid #334155;border-radius:12px;padding:11px}.v170actions{display:flex;gap:6px;flex-wrap:wrap}.v170pill{display:inline-block;background:#1e293b;border-radius:999px;padding:4px 8px;margin:2px;font-size:11px}@media(max-width:560px){.v170grid{grid-template-columns:1fr}}
</style>
<script>
// v17.0 GENERATIONS & LEGACY — aging, family, heirs, inheritance and persistent dynasty history
(function(){
 const K='sd_v170_legacy';
 const D={age:18,birthdayDay:1,generation:1,familyName:'Dynasty',partner:'',married:false,children:[],heir:'',will:{cashPct:50,businessPct:25,propertyPct:25},legacyRep:0,yearsLived:0,lastDay:1,history:['Generation 1 begins. Build a life worth inheriting.']};
 function load(){try{return Object.assign({},D,JSON.parse(localStorage.getItem(K))||{})}catch(e){return Object.assign({},D)}}
 function saveL(x){localStorage.setItem(K,JSON.stringify(x))}
 function gameDay(){try{return Math.max(1,Number(s.day||1))}catch(e){return 1}}
 function gameCash(){try{return Number(s.cash||0)}catch(e){return 0}}
 function setGameCash(v){try{s.cash=Math.max(0,Math.floor(v));if(typeof save==='function')save()}catch(e){}}
 function note(x,t){x.history.unshift(t);x.history=x.history.slice(0,10);try{if(typeof record==='function')record('👑 '+t,'LEGACY')}catch(e){}}
 function syncAge(x){let d=gameDay();if(d>x.lastDay){let passed=d-x.lastDay;let birthdays=Math.floor((x.birthdayDay+passed-1)/30);if(birthdays>0){x.age+=birthdays;x.yearsLived+=birthdays;x.birthdayDay=((x.birthdayDay+passed-1)%30)+1;x.children=x.children.map(c=>Object.assign({},c,{age:(c.age||0)+birthdays}));note(x,'A birthday passed. You are now '+x.age+'. Your family aged with you.')}else x.birthdayDay+=passed;x.lastDay=d;saveL(x)}}
 function name(){let pool=['Jordan','Avery','Cameron','Riley','Kai','Maya','Noah','Zoe'];return pool[Math.floor(Math.random()*pool.length)]}
 window.sdV170=function(a,i){let x=load();syncAge(x);if(a==='date'){if(x.partner)return alert('You already have a partner.');x.partner=name();note(x,'You started a relationship with '+x.partner+'.')}if(a==='marry'){if(!x.partner)return alert('Build a relationship first.');x.married=true;note(x,'You married '+x.partner+'. Your dynasty now has a spouse.')}if(a==='child'){if(!x.married)return alert('Marriage is required for this legacy path.');if(x.children.length>=6)return alert('Your household is full.');let n=name();x.children.push({name:n,age:0,bond:50,skills:0});if(!x.heir)x.heir=n;note(x,n+' joined the family. A new possible heir exists.')}if(a==='bond'){let c=x.children[i];if(!c)return;c.bond=Math.min(100,(c.bond||0)+10);c.skills=(c.skills||0)+1;note(x,'You spent time teaching '+c.name+'. Bond and future skills improved.')}if(a==='heir'){let c=x.children[i];if(!c)return;x.heir=c.name;note(x,c.name+' was named heir.')}if(a==='legacy'){x.legacyRep+=5;note(x,'You invested in the family name. Legacy reputation +5.')}if(a==='nextgen'){if(!x.heir)return alert('Choose an heir first.');let h=x.children.find(c=>c.name===x.heir);if(!h)return alert('Heir not found.');let inherited=Math.floor(gameCash()*x.will.cashPct/100);setGameCash(inherited);x.generation++;x.age=Math.max(18,h.age||18);x.partner='';x.married=false;x.children=[];x.heir='';x.legacyRep+=10;x.lastDay=gameDay();x.birthdayDay=1;note(x,'Generation '+x.generation+' begins as '+h.name+'. $'+inherited+' cash carried forward under the will.');try{if(typeof addFeed==='function')addFeed('A new generation of the '+x.familyName+' dynasty has begun.','LEGACY')}catch(e){}}saveL(x);render17()};
 window.sdV170Will=function(){let x=load(),v=prompt('Cash inheritance percent (0-100)',x.will.cashPct);if(v===null)return;v=Math.max(0,Math.min(100,Number(v)||0));x.will.cashPct=v;x.will.businessPct=Math.floor((100-v)/2);x.will.propertyPct=100-v-x.will.businessPct;note(x,'Will updated: '+v+'% cash, '+x.will.businessPct+'% business, '+x.will.propertyPct+'% property legacy.');saveL(x);render17()};
 function render17(){let h=document.getElementById('v170Legacy');if(!h)return;let x=load();syncAge(x);let kids=x.children.map((c,i)=>`<div class="v170box"><b>${c.name}</b> • age ${c.age}<br><span class="muted">Bond ${c.bond}/100 • Training ${c.skills||0}</span><div class="v170actions"><button onclick="sdV170('bond',${i})">Spend Time</button><button onclick="sdV170('heir',${i})">Name Heir</button></div></div>`).join('')||'<p class="muted">No children yet.</p>';h.innerHTML=`<h2>👑 v17.0 — Generations & Legacy</h2><p class="muted">Your character can age, build a family, choose an heir and continue the same world through future generations.</p><div class="v170grid"><div class="v170box"><h3>🧬 Dynasty</h3><p>Generation <b>${x.generation}</b><br>Age <b>${x.age}</b><br>Legacy reputation <b>${x.legacyRep}</b><br>Heir <b>${x.heir||'None'}</b></p><button onclick="sdV170('legacy')">Build Family Legacy</button></div><div class="v170box"><h3>❤️ Family</h3><p>Partner <b>${x.partner||'None'}</b><br>Status <b>${x.married?'Married':'Single / Dating'}</b><br>Children <b>${x.children.length}</b></p><div class="v170actions"><button onclick="sdV170('date')">Meet Someone</button><button onclick="sdV170('marry')">Marry Partner</button><button onclick="sdV170('child')">Grow Family</button></div></div><div class="v170box"><h3>📜 Will & Inheritance</h3><p>Cash ${x.will.cashPct}% • Business ${x.will.businessPct}% • Property ${x.will.propertyPct}%</p><button onclick="sdV170Will()">Update Will</button><p class="muted">The current playable inheritance transfers cash directly. Business/property percentages are preserved as dynasty legacy records for future expansion.</p></div><div class="v170box"><h3>⏭️ Continue as Heir</h3><p>When you are ready to end this character's chapter, continue as the chosen heir while the dynasty history remains.</p><button onclick="sdV170('nextgen')">Begin Next Generation</button></div></div><h3>👨‍👩‍👧 Children & Heirs</h3><div class="v170grid">${kids}</div><h3>📚 Dynasty History</h3>${x.history.map(t=>`<div class="v150notice">${t}</div>`).join('')}`}
 function mount17(){if(document.getElementById('v170Legacy'))return;let p=[...document.querySelectorAll('main,.content,#content,#app')].find(e=>e.offsetParent!==null)||document.body,d=document.createElement('section');d.id='v170Legacy';d.className='card';p.appendChild(d);render17()}
 let old=window.render;if(typeof old==='function')window.render=function(){let r=old.apply(this,arguments);setTimeout(mount17,0);return r};window.addEventListener('load',()=>setTimeout(mount17,1100));
})();
</script>
